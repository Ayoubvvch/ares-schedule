name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Prepare APK Asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk Ares-Schedule-v1.0.4.apk
          ls -lh Ares-Schedule-v1.0.4.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "Ares Schedule v1.0.4 🔑 (Permanent Signing Key & Seamless Updates)"
          body: |
            ## 🔑 Ares Schedule v1.0.4 (Permanent Keystore Edition)
            
            ### ✨ What's Fixed in v1.0.4:
            - 🔐 **Permanent Release Keystore Signing:** Replaced ephemeral CI-generated keystore with a permanent, committed release keystore (`keystore/release.jks`).
            - 🔄 **Seamless In-Place Updates:** Eliminates `INSTALL_FAILED_UPDATE_INCOMPATIBLE` signature mismatch errors. From this version forward, you will never need to uninstall the app to install new updates!
            - 🇲🇦 **All 16 Moroccan Holidays Integrated:** Includes today's National Unity Day Void mode and next Friday's Green March countdown.
            
            ### 📥 Download & Install
            **Important:** Because previous builds (v1.0.0-v1.0.3) used ephemeral CI keys, please uninstall the older version one last time, and install `Ares-Schedule-v1.0.4.apk`. From now on, all upcoming updates will install directly over it with zero friction!
          files: |
            Ares-Schedule-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
