name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ares -keypass android -storepass android \
            -dname "CN=Ares, OU=Ares, O=Ares, L=Tetouan, ST=Tetouan, C=MA"

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Prepare APK Asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk Ares-Schedule-v1.0.1.apk
          ls -lh Ares-Schedule-v1.0.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Ares Schedule v1.0.1 🖤 (OLED Edition - Stability Fix)"
          body: |
            ## 🖤 Ares Schedule v1.0.1 (OLED Black Edition)
            
            ### 🛠️ What's Fixed in v1.0.1:
            - 🛡️ **Fixed Instant Crash on Launch:** Removed fragile WindowInsetsController call during onCreate() that caused crashes on certain Android ROMs.
            - 🎨 **Universal PNG Adaptive Icons:** Replaced XML VectorDrawable icons with multi-density PNG icons to eliminate PathParser inflation crashes on OEM launchers.
            - 🌐 **Added Network State & Internet Permissions:** Prevents WebView SecurityException on strict Android builds.
            - ⚡ **Fail-Safe WebView Initialization:** Protected with try/catch fallback to prevent silent crashes.
            
            ### 📥 Download & Install
            Download and install `Ares-Schedule-v1.0.1.apk` below directly on your Android phone.
          files: |
            Ares-Schedule-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
