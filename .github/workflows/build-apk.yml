name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ares -keypass android -storepass android \
            -dname "CN=Ares, OU=Ares, O=Ares, L=Tetouan, ST=Tetouan, C=MA"

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Prepare APK Asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk Ares-Schedule-v1.0.2.apk
          ls -lh Ares-Schedule-v1.0.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Ares Schedule v1.0.2 🏖️ (Void Holidays & Moroccan Calendar Edition)"
          body: |
            ## 🏖️ Ares Schedule v1.0.2 (Moroccan Holidays & Void Mode)
            
            ### ✨ What's New in v1.0.2:
            - 🇲🇦 **Official Moroccan School Holidays (2026/2027):** Integrated all 15 official school, national, and religious holidays (57 total days off) with full dates and durations.
            - 🏖️ **Automatic Void Day Detection:** When opening the app on any official holiday, the day automatically transitions to **Void Holiday Mode** (no classes, ambient emerald glow, holiday details, and relaxation note).
            - 📅 **Dedicated Holidays Calendar Tab (`🏖️ Holidays`):** Browse all Moroccan vacations chronologically with live countdowns (`Active Now`, `In X Days`, `Completed`).
            - 👁️ **Interactive Void Mode Preview:** Instant preview button for each holiday so you can test and view the Void screen anytime.
            - ⚡ **OLED Ultra Black Theme:** Retains pitch-black contrast and maximum power efficiency for AMOLED screens.
            
            ### 📥 Download & Install
            Download and install `Ares-Schedule-v1.0.2.apk` below directly on your Android phone.
          files: |
            Ares-Schedule-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
