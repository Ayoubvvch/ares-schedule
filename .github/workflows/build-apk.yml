name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ares -keypass android -storepass android \
            -dname "CN=Ares, OU=Ares, O=Ares, L=Tetouan, ST=Tetouan, C=MA"

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Prepare APK Asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk Ares-Schedule-v1.0.3.apk
          ls -lh Ares-Schedule-v1.0.3.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Ares Schedule v1.0.3 🏖️ (National Unity Day & Next Friday Holiday Detection)"
          body: |
            ## 🏖️ Ares Schedule v1.0.3 (National Unity Day & Holiday Intelligence)
            
            ### ✨ What's Fixed & Added in v1.0.3:
            - 🇲🇦 **Today is a Holiday (National Unity Day - 31 Oct):** Added the official National Unity Day (`عيد الوحدة الوطني - السبت 31 أكتوبر 2026`) into the Moroccan holiday calendar. Today is now detected immediately on startup as a full **Void Day**!
            - 🔔 **Next Friday Holiday Detection:** Intelligent notification alerts that next Friday (06 Nov) is an official holiday (`ذكرى المسيرة الخضراء`).
            - 📅 **Complete 16 Holidays (58 Total Days Off):** Comprehensive 2026/2027 Moroccan official school and national calendar.
            - 🏖️ **Dynamic Day Tab Detection:** Clicking any day tab (e.g. today or Saturday) checks against the calendar and displays Void Day when applicable.
            
            ### 📥 Download & Install
            Download and install `Ares-Schedule-v1.0.3.apk` below directly on your Android phone.
          files: |
            Ares-Schedule-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
